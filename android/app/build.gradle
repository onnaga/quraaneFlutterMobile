plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // ✅ تم نقل إضافة خدمات جوجل إلى هنا، وهي الطريقة الأحدث والأكثر استقرارًا
    id 'com.google.gms.google-services'
}

android {
    namespace = "com.example.masjed"
    // ✅ تأكد من أن compileSdk هو 34 أو أحدث
    compileSdk = 35
    ndkVersion "25.2.9519653"

    compileOptions {
        // ✅ تحديد توافقية الكود مع Java 17، وهو المطلوب للإصدارات الحديثة من Android Gradle Plugin
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.masjed"
        // ✅ أقل إصدار أندرويد يدعمه التطبيق (متوافق مع متطلبات Firebase)
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = '../..'
}

dependencies {
    // ✅ استخدام Firebase BOM (Bill of Materials) لجلب أحدث الإصدارات المتوافقة تلقائيًا
    implementation platform('com.google.firebase:firebase-bom:33.1.2')

    // مكتبات Firebase المطلوبة بدون تحديد رقم الإصدار (سيتم جلبه من الـ BOM)
    implementation 'com.google.firebase:firebase-messaging-ktx:24.0.2'
    implementation 'com.google.firebase:firebase-analytics-ktx:22.0.2'

    
}

// ❌ لم نعد بحاجة لهذه الطريقة القديمة لتطبيق الإضافة، فقد تم تعريفها في قسم plugins بالأعلى
// apply plugin: 'com.google.gms.google-services'
